<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Teacher | सीखें और गाएं</title>
    <!-- Kid-friendly font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Welcome Message -->
        <header class="welcome-header">
            <h1>नमस्ते बच्चों! 👋</h1>
            <p>मैं आपका AI टीचर हूँ। हम मिलकर मज़े से सीखेंगे!</p>
            <div class="nav-tabs">
                <button class="nav-btn active" id="tab-alphabet">🅰️ A-Z अक्षर</button>
                <button class="nav-btn" id="tab-poems">🎵 कविताएँ</button>
                <button class="nav-btn" id="tab-stories">📚 कहानियाँ</button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main>
            <!-- Display Area for Result -->
            <section class="display-area hidden" id="display-area">
                <div class="card">
                    <button class="close-btn" id="close-btn" aria-label="Close">&times;</button>
                    <!-- Alphabet View -->
                    <div id="alphabet-view">
                        <div class="emoji-container" id="display-emoji">🍎</div>
                        <div class="word-details">
                            <h2 class="english-word" id="display-word">Apple</h2>
                            <h3 class="hindi-word" id="display-hindi">सेब</h3>
                            <p class="hindi-sentence" id="display-sentence">सेब खाने से हम सेहतमंद और मजबूत बनते हैं!</p>
                        </div>
                    </div>
                    <!-- Poem View -->
                    <div id="poem-view" class="hidden">
                        <div class="emoji-container" id="poem-emoji">⭐</div>
                        <h2 class="english-word" id="poem-title">Twinkle Twinkle</h2>
                        <div class="text-container">
                            <p class="lines" id="poem-lines">Twinkle twinkle little star...</p>
                        </div>
                    </div>
                    <!-- Story View -->
                    <div id="story-view" class="hidden">
                        <div class="emoji-container" id="story-emoji">🐦</div>
                        <h2 class="english-word" id="story-title">The Thirsty Crow</h2>
                        <div class="text-container">
                            <p class="lines" id="story-lines">A crow was very thirsty...</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Alphabet Grid -->
            <section class="grid-container" id="alphabet-grid"></section>

            <!-- Poems Grid -->
            <section class="grid-container hidden" id="poems-grid"></section>

            <!-- Stories Grid -->
            <section class="grid-container hidden" id="stories-grid"></section>
        </main>
        
        <footer>
            <p>मज़े के साथ सीखें! ✨</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
