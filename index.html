<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A to Z Teacher | ए से ज़ेड तक सीखें</title>
    <!-- Kid-friendly font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Welcome Message -->
        <header class="welcome-header">
            <h1>नमस्ते बच्चों! 👋</h1>
            <p>मैं आपका AI टीचर हूँ। हम मिलकर अंग्रेज़ी के अक्षर सीखेंगे।<br>नीचे किसी भी अक्षर पर क्लिक करें या अपने कीबोर्ड से टाइप करें!</p>
        </header>

        <!-- Main Content Area -->
        <main>
            <!-- Display Area for Result -->
            <section class="display-area hidden" id="display-area">
                <div class="card">
                    <button class="close-btn" id="close-btn" aria-label="Close">&times;</button>
                    <div class="emoji-container" id="display-emoji">🍎</div>
                    <div class="word-details">
                        <h2 class="english-word" id="display-word">Apple</h2>
                        <h3 class="hindi-word" id="display-hindi">सेब</h3>
                        <p class="hindi-sentence" id="display-sentence">सेब खाने से हम सेहतमंद और मजबूत बनते हैं!</p>
                    </div>
                </div>
            </section>

            <!-- Alphabet Grid -->
            <section class="alphabet-grid" id="alphabet-grid">
                <!-- Buttons A to Z will be generated by JS -->
            </section>
        </main>
        
        <footer>
            <p>मज़े के साथ सीखें! ✨</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
